<html>
   <head>
      <title>Hospital</title>
   </head>
   <body>
      <h2>Hospital Appointment Form</h2>
      <form action="/hospital">
         Patient Name:
         <input type="text" name="patient_name" required><br><br>
         Age:
         <input type="number" name="age" required><br><br>
         Gender:
         <input type="radio" name="gender" value="male">Male
         <input type="radio" name="gender" value="female">Female
         <input type="radio" name="gender" value="others">Others<br><br>
         Doctor:
         <select name="doctor">
            <option value="Cardiologist">Cardiologist</option>
            <option value="Neurologist">Neurologist</option>
            <option value="Orthodontist">Orthodontist</option>
         </select><br><br>
         Symptoms:
         <input type="checkbox" name="symptoms" value="fever">Fever
         <input type="checkbox" name="symptoms" value="vomitting">Vomitting
         <input type="checkbox" name="symptoms" value="chest_pain">Chest Pain
         <input type="checkbox" name="symptoms" value="headache">Headache<br><br>
         Appointment:
         <select name="appointment">
            <option value="10:00 Am">10:00 AM</option>
            <option value="11:00 Am">11:00 AM</option>
            <option value="01:00 pm">01:00 PM</option>
            <option value="02:00 pm">02:00 PM</option>
         </select><br><br>
         Payment Method:
         <input type="radio" name="payment_method" value="cash" required>Cash
         <input type="radio" name="payment_method" value="upi" >UPI
         <input type="radio" name="payment_method" value="card" >Card<br><br>
         Address:
         <textarea name="address" cols="30" rows="10"></textarea><br><br>
         Submit:
         <input type="submit" value="Submit">
      </form>
   </body>
</html>
